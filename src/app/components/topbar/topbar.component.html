            <li class="dropdown inline-block relative" (clickOutside)="onClickedOutside2($event)">
                <button class="dropdown-toggle size-8 inline-flex items-center justify-center tracking-wide align-middle duration-500 text-[20px] text-center bg-gray-50 dark:bg-slate-800 hover:bg-gray-100 dark:hover:bg-slate-700 border border-gray-100 dark:border-gray-800 text-slate-900 dark:text-white rounded-md" (click)="notificationDropdown()" type="button">
                    <i data-feather="bell" class="size-4"></i>
                    <span class="absolute top-0 end-0 flex items-center justify-center bg-red-600 text-white text-[10px] font-bold rounded-md size-2 after:content-[''] after:absolute after:h-2 after:w-2 after:bg-red-600 after:top-0 after:end-0 after:rounded-md after:animate-ping"></span>
                </button>
                <div class="dropdown-menu absolute end-0 m-0 mt-4 z-10 w-64 rounded-md overflow-hidden bg-white dark:bg-slate-900 shadow-sm shadow-gray-200 dark:shadow-gray-700" [ngClass]="notificationManu ? '' : 'hidden' ">
                    <span class="px-4 py-4 flex justify-between">
                        <span class="font-semibold">Notifications</span>
       <span
       *ngIf="nombreNotifications > 0"
                 class="flex items-center justify-center bg-red-600/20 text-red-600 text-[10px] font-bold rounded-md w-5 max-h-5 ms-1">

    {{ nombreNotifications }}</span> </span>
                  <ul class="py-2 text-start h-64 border-t border-gray-100 dark:border-gray-800"
                      data-simplebar>

                    <li *ngFor="let contrat of contratsEnAttente">

                      <a
                        [routerLink]="'/mes-contrats'"
                        class="block font-medium py-1.5 px-4">

                        <div class="flex items-center">

                          <div class="size-10 rounded-md
                            bg-green-600/10 dark:bg-slate-800
                            text-green-600 dark:text-white
                            flex items-center justify-center">

                            <i class="mdi mdi-file-document-outline text-xl"></i>

                          </div>

                          <div class="ms-2">

                    <span class="text-[15px] font-medium block">
                        Nouveau contrat à signer
                    </span>

                            <small class="text-slate-400">
                              {{ contrat.titre }}
                            </small>

                          </div>

                        </div>

                      </a>

                    </li>


                    <!-- AUCUNE NOTIFICATION -->
                    <li
                      *ngIf="contratsEnAttente.length === 0"
                      class="py-8 text-center">

                      <i class="mdi mdi-bell-check-outline text-3xl text-slate-400"></i>

                      <p class="text-slate-400 text-sm mt-2">
                        Aucune nouvelle notification
                      </p>

                    </li>

                  </ul>
                </div>
            </li>

          <li class="dropdown inline-block relative" (clickOutside)="onClickedOutside3($event)">
            <button class="dropdown-toggle items-center" type="button" (click)="userDropdown()">
        <span class="size-8 inline-flex items-center justify-center tracking-wide align-middle duration-500 text-[20px] text-center bg-gray-50 dark:bg-slate-800 hover:bg-gray-100 dark:hover:bg-slate-700 border border-gray-100 dark:border-gray-800 text-slate-900 dark:text-white rounded-md">
            <img [src]="'/assets/images/client/07.jpg'" class="rounded-md" alt="">
        </span>
            </button>

            <div class="dropdown-menu absolute end-0 m-0 mt-4 z-10 w-44 rounded-md overflow-hidden bg-white dark:bg-slate-900 shadow-sm shadow-gray-200 dark:shadow-gray-700"
                 [ngClass]="userManu ? '' : 'hidden'">

              <ul class="py-2 text-start">

                <li>
                  <a [routerLink]="'/profile'"
                     class="block py-1 px-4 dark:text-white/70 hover:text-green-600 dark:hover:text-white">
                    <i class="mdi mdi-account-outline me-2"></i>
                    Profil
                  </a>
                </li>

                <li>
                  <a [routerLink]="'/chat'"
                     class="block py-1 px-4 dark:text-white/70 hover:text-green-600 dark:hover:text-white">
                    <i class="mdi mdi-chat-outline me-2"></i>
                    Messagerie
                  </a>
                </li>

                <li>
                  <a [routerLink]="'/profile-setting'"
                     class="block py-1 px-4 dark:text-white/70 hover:text-green-600 dark:hover:text-white">
                    <i class="mdi mdi-cog-outline me-2"></i>
                    Paramètres
                  </a>
                </li>

                <li class="border-t border-gray-100 dark:border-gray-800 my-2"></li>

                <li>
                  <a (click)="logout($event)"
                     class="block py-1 px-4 dark:text-white/70 hover:text-green-600 dark:hover:text-white">
                    <i class="mdi mdi-logout me-2"></i>
                    Déconnexion
                  </a>
                </li>

              </ul>
            </div>
          </li>
        </ul>
    </div>
</div>
