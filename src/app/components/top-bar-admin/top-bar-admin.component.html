<div class="top-header">
  <div class="header-bar flex justify-between">

    <!-- GAUCHE -->
    <div class="flex items-center space-x-1">

      <!-- Logo mobile -->
      <a
        [routerLink]="[]"
        (click)="$event.preventDefault()"
        class="xl:hidden block me-2">

        <span class="md:block hidden">
          <img
            src="/assets/images/logo-dark.png"
            class="inline-block dark:hidden"
            alt="Logo">

          <img
            src="/assets/images/logo-light.png"
            class="hidden dark:inline-block"
            alt="Logo">
        </span>
      </a>

      <!-- Menu sidebar -->
      <a
        id="close-sidebar"
        class="size-8 inline-flex items-center justify-center
               tracking-wide align-middle duration-500 text-[20px]
               text-center bg-gray-50 dark:bg-slate-800
               hover:bg-gray-100 dark:hover:bg-slate-700
               border border-gray-100 dark:border-gray-800
               text-slate-900 dark:text-white rounded-md"
        [routerLink]="[]"
        (click)="emitToggleClassEvent()">

      <i class="mdi mdi-menu text-xl"></i>
      </a>

      <!-- Recherche -->
      <div class="ps-1.5">
        <div class="form-icon relative sm:block hidden">

          <i class="mdi mdi-magnify absolute
                    top-1/2 -translate-y-1/2
                    mt-[1px] start-3">
          </i>

          <input
            type="text"
            class="form-input w-56 py-2 px-3 !ps-9 !h-8
                   bg-transparent dark:bg-slate-900
                   dark:text-slate-200 rounded-md
                   outline-none border !border-gray-200
                   dark:!border-gray-800 focus:ring-0"
            placeholder="Rechercher...">

        </div>
      </div>

    </div>


    <!-- DROITE -->
    <ul class="list-none mb-0 space-x-1">

      <!-- Voir le site -->
      <li class="inline-block relative">

        <a
          routerLink="/"
          title="Voir le site"
          class="size-8 inline-flex items-center justify-center
                 tracking-wide align-middle duration-500 text-[20px]
                 text-center bg-gray-50 dark:bg-slate-800
                 hover:bg-gray-100 dark:hover:bg-slate-700
                 border border-gray-100 dark:border-gray-800
                 text-slate-900 dark:text-white rounded-md">

          <i class="mdi mdi-web text-lg"></i>

        </a>

      </li>


      <!-- PROFIL ADMIN -->
      <li
        class="dropdown inline-block relative"
        (clickOutside)="onClickedOutside3($event)">

        <button
          class="dropdown-toggle items-center"
          type="button"
          (click)="userDropdown()">

     <span class="size-8 inline-flex items-center justify-center tracking-wide align-middle duration-500 text-[20px] text-center bg-gray-50 dark:bg-slate-800 hover:bg-gray-100 dark:hover:bg-slate-700 border border-gray-100 dark:border-gray-800 text-slate-900 dark:text-white rounded-md">
  <img
    [src]="user.photoProfil ? apiUrl + user.photoProfil : '/assets/images/client/user.jpg'"
    class="rounded-full shadow-sm shadow-gray-200 dark:shadow-gray-700 ring-4 ring-slate-50 dark:ring-slate-800"
    id="profile-image"
    alt="">
        </span>
        </button>


        <!-- Dropdown Admin -->
        <div
          class="dropdown-menu absolute end-0 m-0 mt-4 z-10
                 w-48 rounded-md overflow-hidden
                 bg-white dark:bg-slate-900
                 shadow-sm shadow-gray-200 dark:shadow-gray-700"
          [ngClass]="userManu ? '' : 'hidden'">


          <!-- Informations admin -->
          <div
            class="px-4 py-3 border-b
                   border-gray-100 dark:border-gray-800">

            <span
              class="block text-sm font-semibold
                     text-slate-900 dark:text-white">
              Administrateur
            </span>

            <span class="block text-xs text-slate-400 mt-1">
              Espace administration
            </span>

          </div>


          <ul class="py-2 text-start">

            <!-- Profil -->
            <li>
              <a
                routerLink="/profile-admin"
                class="block py-1.5 px-4
                       dark:text-white/70
                       hover:text-green-600
                       dark:hover:text-white">

                <i class="mdi mdi-account-outline me-2"></i>
                Mon profil

              </a>
            </li>


            <!-- Paramètres -->
            <li>
              <a
                routerLink="/setting-admin"
                class="block py-1.5 px-4
                       dark:text-white/70
                       hover:text-green-600
                       dark:hover:text-white">

                <i class="mdi mdi-cog-outline me-2"></i>
                Paramètres

              </a>
            </li>


            <!-- Dashboard -->
            <li>
              <a
                routerLink="/dashboard-admin"
                class="block py-1.5 px-4
                       dark:text-white/70
                       hover:text-green-600
                       dark:hover:text-white">

                <i class="mdi mdi-view-dashboard-outline me-2"></i>
                Tableau de bord

              </a>
            </li>


            <li
              class="border-t border-gray-100
                     dark:border-gray-800 my-2">
            </li>


            <!-- Déconnexion -->
            <li>
              <a
                (click)="logout($event)"
                class="block py-1.5 px-4 cursor-pointer
                       text-red-600 hover:text-red-700">

                <i class="mdi mdi-logout me-2"></i>
                Déconnexion

              </a>
            </li>

          </ul>

        </div>

      </li>

    </ul>

  </div>
</div>
