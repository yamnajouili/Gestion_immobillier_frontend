<div class="container relative lg:mt-24 mt-16">
  <div class="grid grid-cols-1 pb-8 text-center">
    <h3 class="mb-4 md:text-3xl md:leading-normal text-2xl leading-normal font-semibold">
      Avis de nos utilisateurs
    </h3>

    <p class="text-slate-400 max-w-xl mx-auto">
      Consultez les retours de nos utilisateurs et découvrez comment notre plateforme facilite la recherche de biens immobiliers.
    </p>
  </div>

    <div class="flex justify-center relative mt-16">
        <div class="relative lg:w-1/3 md:w-1/2 w-full">
            <div class="absolute -top-20 md:-start-24 -start-0">
                <i class="mdi mdi-format-quote-open text-9xl opacity-5"></i>
            </div>

            <div class="absolute bottom-28 md:-end-24 -end-0">
                <i class="mdi mdi-format-quote-close text-9xl opacity-5"></i>
            </div>

            <div class="tiny-single-item">
                <div *ngFor="let item of clientData" class="tiny-slide">
                    <div class="text-center">
                        <p class="text-xl text-slate-400 italic">{{item.desc}}</p>

                        <div class="text-center mt-5">
                            <ul class="text-xl font-medium text-amber-400 list-none mb-2">
                                <li class="inline mx-0.5"><i class="mdi mdi-star"></i></li>
                                <li class="inline mx-0.5"><i class="mdi mdi-star"></i></li>
                                <li class="inline mx-0.5"><i class="mdi mdi-star"></i></li>
                                <li class="inline mx-0.5"><i class="mdi mdi-star"></i></li>
                                <li class="inline mx-0.5"><i class="mdi mdi-star"></i></li>
                            </ul>

                            <img [src]="item.image" class="size-14 !rounded-full shadow-md shadow-gyay-200 dark:shadow-gray-700 mx-auto" alt="">
                            <h6 class="mt-2 fw-semibold">{{item.name}}</h6>
                            <span class="text-slate-400 text-sm">{{item.title}}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
