<app-tagline/>

<app-navbar [tagline]="true"/>

<section class="relative overflow-hidden md:h-screen flex items-center md:py-0 py-36 bg-cyan-100 dark:bg-cyan-500/20 bg-[url('/assets/images/bg/bg3.png')] bg-no-repeat bg-top bg-cover">
    <div class="container relative">
        <div class="grid grid-cols-1 items-center mt-10">
            <div class="md:text-start text-center">
                <h1 class="font-bold lg:leading-normal leading-normal text-4xl lg:text-5xl mb-6">We will find a perfect <br> home for you</h1>
                <p class="text-xl max-w-xl">A great plateform to buy, sell and rent your properties without any agent or commisions.</p>

                <div class="relative flex mt-8">
                    <div class="lg:w-5/6 w-full">
                        <ul class="inline-block sm:w-fit w-full flex-wrap justify-center text-center p-4 bg-white dark:bg-slate-900 rounded-t-xl border-b border-gray-200 dark:border-gray-800" id="myTab" data-tabs-toggle="#StarterContent" role="tablist">
                            <li role="presentation" class="inline-block">
                                <button class="px-6 py-2 text-base font-medium rounded-md w-full hover:text-green-600 transition-all duration-500 ease-in-out" id="buy-home-tab" (click)="formTab(1)" [ngClass]="activeindex === 1 ? 'text-white bg-green-600 hover:text-white' : '' ">Buy</button>
                            </li>
                            <li role="presentation" class="inline-block">
                                <button class="px-6 py-2 text-base font-medium rounded-md w-full hover:text-green-600 transition-all duration-500 ease-in-out" [ngClass]="activeindex === 2 ? 'text-white bg-green-600 hover:text-white' : '' " (click)="formTab(2)" >Sell</button>
                            </li>
                            <li role="presentation" class="inline-block">
                                <button class="px-6 py-2 text-base font-medium rounded-md w-full hover:text-green-600 transition-all duration-500 ease-in-out" [ngClass]="activeindex === 3 ? 'text-white bg-green-600 hover:text-white' : '' "  (click)="formTab(3)">Rent</button>
                            </li>
                        </ul>
    
                        <div id="StarterContent" class="p-6 bg-white dark:bg-slate-900 rounded-ss-none rounded-se-none md:rounded-se-xl rounded-xl shadow-md shadow-gyay-200 dark:shadow-gray-700">
                            
                            <div [ngClass]="activeindex===1 ? '' : 'hidden' " id="buy-home" role="tabpanel" aria-labelledby="buy-home-tab">
                                <form action="#">
                                    <div class="registration-form text-dark text-start">
                                        <div class="grid lg:grid-cols-4 md:grid-cols-2 grid-cols-1 lg:gap-0 gap-6">
                                            <div>
                                                <label class="form-label font-medium text-slate-900 dark:text-white">Search : <span class="text-red-600">*</span></label>
                                                <div class="filter-search-form relative filter-border mt-2">
                                                    <i class="uil uil-search icons"></i>
                                                    <input name="name" type="text" id="job-keyword" class="form-input filter-input-box !bg-gray-50 dark:!bg-slate-800 border-0" placeholder="Search your keaywords">
                                                </div>
                                            </div>
                                            
    
                                            <div>
                                                <label for="buy-properties" class="form-label font-medium text-slate-900 dark:text-white">Select Categories:</label>
                                                <div class="filter-search-form relative filter-border mt-2">
                                                    <i class="uil uil-estate icons"></i>
                                                    <ng-select class="form-input w-full filter-input-box !bg-gray-50 h-[60px] dark:!bg-slate-800 border-0 focus:ring-0 ps-10" [items]="property" bindLabel="name" bindValue="id" placeholder="House">
                                                    </ng-select>
                                                </div>
                                            </div>
                                        
                                            <div>
                                                <label for="buy-min-price" class="form-label font-medium text-slate-900 dark:text-white">Budget :</label>
                                                <div class="filter-search-form relative filter-border mt-2">
                                                    <i class="uil uil-usd-circle icons"></i>
                                                    <ng-select class="form-input w-full filter-input-box !bg-gray-50 h-[60px] dark:!bg-slate-800 border-0 focus:ring-0 ps-10" [items]="minPrice" bindLabel="name" bindValue="id" placeholder="500">
                                                    </ng-select>
                                                </div>
                                            </div>
    
                                            <div class="lg:mt-8">
                                                <input type="submit" id="search-buy" name="search" class="btn bg-green-600 hover:bg-green-700 border-green-600 hover:border-green-700 text-white searchbtn submit-btn w-full !h-[60px] rounded lg:rounded-none" value="Search">
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
    
                            <div [ngClass]="activeindex===2 ? '' : 'hidden' " id="sell-home" role="tabpanel" aria-labelledby="sell-home-tab">
                                <form action="#">
                                    <div class="registration-form text-dark ltr:text-start rtl:text-end">
                                        <div class="grid lg:grid-cols-4 md:grid-cols-2 grid-cols-1 lg:gap-0 gap-6">
                                            <div>
                                                <label class="form-label font-medium text-slate-900 dark:text-white">Search : <span class="text-red-600">*</span></label>
                                                <div class="filter-search-form relative filter-border mt-2">
                                                    <i class="uil uil-search icons"></i>
                                                    <input name="name" type="text" id="job-keyword" class="form-input filter-input-box !bg-gray-50 dark:!bg-slate-800 border-0" placeholder="Search your keaywords">
                                                </div>
                                            </div>
    
                                            <div>
                                                <label for="buy-properties" class="form-label font-medium text-slate-900 dark:text-white">Select Categories:</label>
                                                <div class="filter-search-form relative filter-border mt-2">
                                                    <i class="uil uil-estate icons"></i>
                                                    <ng-select class="form-input w-full filter-input-box !bg-gray-50 h-[60px] dark:!bg-slate-800 border-0 focus:ring-0 ps-10" [items]="property" bindLabel="name" bindValue="id" placeholder="House">
                                                    </ng-select>
                                                </div>
                                            </div>
                                        
                                            <div>
                                                <label for="buy-min-price" class="form-label font-medium text-slate-900 dark:text-white">Budget :</label>
                                                <div class="filter-search-form relative filter-border mt-2">
                                                    <i class="uil uil-usd-circle icons"></i>
                                                    <ng-select class="form-input w-full filter-input-box !bg-gray-50 h-[60px] dark:!bg-slate-800 border-0 focus:ring-0 ps-10" [items]="minPrice" bindLabel="name" bindValue="id" placeholder="500">
                                                    </ng-select>
                                                </div>
                                            </div>
    
                                            <div class="lg:mt-8">
                                                <input type="submit" id="search-sell" name="search" class="btn bg-green-600 hover:bg-green-700 border-green-600 hover:border-green-700 text-white searchbtn submit-btn w-full !h-[60px] rounded lg:rounded-none" value="Search">
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
    
                            <div [ngClass]="activeindex=== 3? '' : 'hidden' " id="rent-home" role="tabpanel" aria-labelledby="rent-home-tab">
                                <form action="#">
                                    <div class="registration-form text-dark ltr:text-start rtl:text-end">
                                        <div class="grid lg:grid-cols-4 md:grid-cols-2 grid-cols-1 lg:gap-0 gap-6">
                                            <div>
                                                <label class="form-label font-medium text-slate-900 dark:text-white">Search : <span class="text-red-600">*</span></label>
                                                <div class="filter-search-form relative filter-border mt-2">
                                                    <i class="uil uil-search icons"></i>
                                                    <input name="name" type="text" id="job-keyword" class="form-input filter-input-box !bg-gray-50 dark:!bg-slate-800 border-0" placeholder="Search your keaywords">
                                                </div>
                                            </div>
    
                                            <div>
                                                <label for="buy-properties" class="form-label font-medium text-slate-900 dark:text-white">Select Categories:</label>
                                                <div class="filter-search-form relative filter-border mt-2">
                                                    <i class="uil uil-estate icons"></i>
                                                    <ng-select class="form-input w-full filter-input-box !bg-gray-50 h-[60px] dark:!bg-slate-800 border-0 focus:ring-0 ps-10" [items]="property" bindLabel="name" bindValue="id" placeholder="House">
                                                    </ng-select>
                                                </div>
                                            </div>
                                        
                                            <div>
                                                <label for="buy-min-price" class="form-label font-medium text-slate-900 dark:text-white">Budget :</label>
                                                <div class="filter-search-form relative filter-border mt-2">
                                                    <i class="uil uil-usd-circle icons"></i>
                                                    <ng-select class="form-input w-full filter-input-box !bg-gray-50 h-[60px] dark:!bg-slate-800 border-0 focus:ring-0 ps-10" [items]="minPrice" bindLabel="name" bindValue="id" placeholder="500">
                                                    </ng-select>
                                                </div>
                                            </div>
                                            <div class="lg:mt-8">
                                                <input type="submit" id="search-rent" name="search" class="btn bg-green-600 hover:bg-green-700 border-green-600 hover:border-green-700 text-white searchbtn submit-btn w-full !h-[60px] rounded lg:rounded-none" value="Search">
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="relative lg:pb-24 pb-16">
    <app-about/>
    <app-features/>
</section>

<section class="relative py-24 bg-[url('/assets/images/bg/01.jpg')] bg-no-repeat bg-center bg-fixed bg-cover">
    <div class="absolute inset-0 bg-slate-900/60"></div>
    <div class="container relative">
        <div class="grid lg:grid-cols-12 grid-cols-1 md:text-start text-center justify-center">
            <div class="lg:col-start-2 lg:col-span-10">
                <div class="grid md:grid-cols-3 grid-cols-1 items-center">
                    <div *ngFor="let item of counterData" class="counter-box text-center">
                        <h1 class="text-white lg:text-5xl text-4xl font-semibold mb-2"><span class="counter-value" [countUp]="item.target">0</span>+</h1>
                        <h5 class="counter-head text-white text-lg font-medium">{{item.name}}</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="relative md:py-24 py-16">
    <app-categories/>

    <div class="relative lg:mt-24 mt-16">
        <div class="grid grid-cols-1 pb-8 text-center">
            <h3 class="mb-4 md:text-3xl md:leading-normal text-2xl leading-normal font-semibold">Featured Properties</h3>

            <p class="text-slate-400 max-w-xl mx-auto">A great plateform to buy, sell and rent your properties without any agent or commisions.</p>
        </div>
        <app-properties-three/>
    </div>
    <app-clients/>
    <app-team/>
    <app-get-in-touch/>
</section>
 <app-footer/>
