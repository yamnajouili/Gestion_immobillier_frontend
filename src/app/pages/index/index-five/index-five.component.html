<app-navbar/>

<section class="relative md:pt-44 pt-36 bg-gradient-to-b from-slate-50 dark:from-slate-800 to-transparent">
    <div class="container relative">
        <div class="grid grid-cols-1">
            <div class="text-center">
                <h1 class="font-bold lg:leading-normal leading-normal text-4xl lg:text-5xl mb-6">Are you ready to find your dream home</h1>
                <p class="text-slate-400 mx-auto text-xl max-w-xl">A great plateform to buy, sell and rent your properties without any agent or commisions.</p>

                <div class="subcribe-form relative z-1 mt-8">
                    <form class="relative max-w-2xl mx-auto">
                        <i data-feather="search" class="size-5 absolute top-[47%] -translate-y-1/2 start-4"></i>
                        <input type="name" id="search_name" name="name" class="rounded-full bg-white dark:bg-slate-900 shadow-sm dark:shadow-gray-700 !ps-12" placeholder="City, Address, Zip :">
                        <button type="submit" class="btn bg-green-600 hover:bg-green-700 text-white !rounded-full">Search</button>
                    </form>
                </div>
            </div>
            <div class="relative -mt-[25px]">
                <img [src]="'/assets/images/bg/05.jpg'" class="rounded-xl shadow-md shadow-gyay-200 dark:shadow-gray-700" alt="">
                <div class="absolute bottom-2/4 translate-y-2/4 start-0 end-0 text-center">
                    <a [routerLink]="[]"  (click)="isOpen = !isOpen" class="lightbox size-20 !rounded-full shadow-md  dark:shadow-gray-800 inline-flex items-center justify-center bg-white dark:bg-slate-900 text-green-600">
                        <i class="mdi mdi-play inline-flex items-center justify-center text-2xl"></i>
                    </a>
                </div>
                <div *ngIf="isOpen" class="flex bg-[#00000099] overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
                    <div class="relative p-1 w-full max-w-2xl max-h-full">
                        <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
                            <div class="flex items-center justify-between p-1 border-b rounded-t dark:border-gray-600 border-gray-200">
                                <button type="button" (click)="isOpen = !isOpen" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="default-modal">
                                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                                        <path stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                                    </svg>
                                    <span class="sr-only">Close modal</span>
                                </button>
                            </div>
                            <div class="p-1 md:p-1 space-y-4">
                                <iframe width="100%" height="400" src="https://www.youtube.com/embed/yba7hPeTSjk?playlist=yba7hPeTSjk&loop=1"></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>               
    </div>
</section>

<section class="relative md:py-24 py-16">
    <app-categories/>

    <app-about/>

    <app-features/>

   <app-properties-two/>

   <app-clients/>

   <app-get-in-touch/>
</section>

<app-footer/>
