<app-navbar/>

<section class="relative overflow-hidden md:h-screen pt-36 md:pb-48 pb-64 bg-green-600/10 dark:bg-green-600/20 bg-[url('/assets/images/bg/bg2.png')] bg-no-repeat bg-bottom bg-cover">
    <div class="container relative">
        <div class="grid grid-cols-1 items-center mt-10">
            <div class="text-center">
                <h1 class="font-bold lg:leading-normal leading-normal text-4xl lg:text-5xl mb-6">Explore Listings and <br> Make Move Today</h1>
                <p class="text-slate-400 text-xl max-w-xl mx-auto">A great plateform to buy, sell and rent your properties without any agent or commisions.</p>

                <div class="subcribe-form z-1 max-w-2xl mx-auto mt-8">
                    <form class="relative">
                        <i data-feather="search" class="size-5 absolute top-[47%] -translate-y-1/2 start-4"></i>
                        <input type="name" id="search_name" name="name" class="rounded-full bg-white dark:bg-slate-900 shadow-sm dark:shadow-gray-700 !ps-12" placeholder="City, Address, Zip :">
                        <button type="submit" class="btn bg-green-600 hover:bg-green-700 text-white !rounded-full">Find Out</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="relative md:py-24 py-16">
    <app-categories-two/>
    <div class="container relative lg:mt-24 mt-16">
        <div class="grid grid-cols-1 pb-8 text-center">
            <h3 class="mb-4 md:text-3xl md:leading-normal text-2xl leading-normal font-semibold">What We Do?</h3>
            <p class="text-slate-400 max-w-xl mx-auto">A great plateform to buy, sell and rent your properties without any agent or commisions.</p>
        </div>

        <div class="grid lg:grid-cols-3 md:grid-cols-2 grid-cols-1 mt-8 gap-[30px]">
            <div *ngFor="let item of about" class="group relative lg:px-10 transition-all duration-500 ease-in-out rounded-xl bg-transparent overflow-hidden text-center">
                <div class="relative overflow-hidden text-transparent -m-3">
                    <i data-feather="hexagon" class="size-32 fill-green-600/5 mx-auto"></i>
                    <div class="absolute top-2/4 -translate-y-2/4 start-0 end-0 mx-auto text-green-600 rounded-xl transition-all duration-500 ease-in-out text-4xl flex align-middle justify-center items-center">
                        <img [src]="item.image" class="size-12" alt="">
                    </div>
                </div>
                <div class="mt-6">
                    <a [routerLink]="[]" class="text-xl font-medium hover:text-green-600">{{item.title}}</a>
                    <p class="text-slate-400 mt-3">{{item.desc}}</p>
                    <div class="mt-4">
                        <a [routerLink]="[]" class="btn btn-link text-green-600 hover:text-green-600 after:bg-green-600 transition duration-500">Read More <i class="uil uil-arrow-right ms-1"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <app-properties/>
</section>

<section class="relative py-24 bg-[url('/assets/images/bg/01.jpg')] bg-no-repeat bg-center bg-fixed bg-cover">
    <div class="absolute inset-0 bg-slate-900/60"></div>
    <div class="container relative">
        <div class="grid lg:grid-cols-12 grid-cols-1 md:text-start text-center justify-center">
            <div class="lg:col-start-2 lg:col-span-10">
                <div class="grid md:grid-cols-3 grid-cols-1 items-center">
                    <div *ngFor="let item of counterData" class="counter-box text-center">
                        <h1 class="text-white lg:text-5xl text-4xl font-semibold mb-2"><span class="counter-value" [countUp]="item.target">0</span>+</h1>
                        <h5 class="counter-head text-white text-lg font-medium">{{item.name}}</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="pt-10">
    <div class="container relative">
        <div class="grid md:grid-cols-6 grid-cols-2 justify-center gap-[30px]">
            <div *ngFor="let item of logoImage" class="mx-auto py-4">
                <img [src]="item" class="h-6" alt="">
            </div>
        </div>
    </div>
</section>

<section class="relative md:pb-24 pb-16">
    <app-clients/>
    <app-team/>
    <app-get-in-touch/>
</section>
<app-footer/>
