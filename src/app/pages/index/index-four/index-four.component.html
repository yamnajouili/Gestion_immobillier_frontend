<app-navbar/>

<section class="relative py-40 lg:h-screen flex justify-center items-center bg-green-600/10">
    <div class="container relative">
        <div class="grid md:grid-cols-2 gap-[30px] mt-10 items-center">
            <div class="md:text-start text-center">
                <h1 class="font-bold lg:leading-normal leading-normal text-4xl lg:text-5xl mb-6">Find Your <span class="text-green-600">Perfect <br> & Wonderful</span> Home</h1>
                <p class="text-slate-400 text-xl max-w-xl">A great plateform to buy, sell and rent your properties without any agent or commisions.</p>

                <div class="relative mt-8">
                    <div class="grid grid-cols-1">
                        <ul class="inline-block sm:w-fit w-full flex-wrap justify-center text-center p-4 bg-white dark:bg-slate-900 rounded-t-xl shadow-sm shadow-gyay-200 dark:shadow-gray-700" id="myTab" data-tabs-toggle="#StarterContent" role="tablist">
                            <li role="presentation" class="inline-block">
                                <button class="px-6 py-2 text-base font-medium rounded-full w-full hover:text-green-600 transition-all duration-500 ease-in-out" id="buy-home-tab" (click)="formTab(1)" [ngClass]="activeindex === 1 ? 'text-white bg-green-600 hover:text-white' : '' ">Buy</button>
                            </li>
                            <li role="presentation" class="inline-block">
                                <button class="px-6 py-2 text-base font-medium rounded-full w-full hover:text-green-600 transition-all duration-500 ease-in-out" [ngClass]="activeindex === 2 ? 'text-white bg-green-600 hover:text-white' : '' " (click)="formTab(2)" >Sell</button>
                            </li>
                            <li role="presentation" class="inline-block">
                                <button class="px-6 py-2 text-base font-medium rounded-full w-full hover:text-green-600 transition-all duration-500 ease-in-out" [ngClass]="activeindex === 3 ? 'text-white bg-green-600 hover:text-white' : '' "  (click)="formTab(3)">Rent</button>
                            </li>
                        </ul>

                        <div id="StarterContent" class="p-6 bg-white dark:bg-slate-900 rounded-ss-none rounded-se-none md:rounded-se-xl rounded-xl shadow-sm shadow-gyay-200 dark:shadow-gray-700">
                            <div *ngIf="activeindex === 1" id="buy-home" role="tabpanel" aria-labelledby="buy-home-tab">
                                <div class="subcribe-form z-1">
                                    <form class="relative max-w-2xl mx-auto">
                                        <i class="uil uil-search text-[20px] absolute top-[50%] -translate-y-1/2 start-4"></i>
                                        <input type="name" id="search_name" name="name" class="rounded-full bg-white dark:bg-slate-900 shadow-sm dark:shadow-gray-700 !ps-12" placeholder="City, Address, Zip :">
                                        <button type="submit" class="btn bg-green-600 hover:bg-green-700 text-white !rounded-full">Find Out</button>
                                    </form>
                                </div>
                            </div>

                            <div *ngIf="activeindex === 2" id="sell-home" role="tabpanel" aria-labelledby="sell-home-tab">
                                <div class="subcribe-form z-1">
                                    <form class="relative max-w-2xl mx-auto">
                                        <i class="uil uil-search text-[20px] absolute top-[50%] -translate-y-1/2 start-4"></i>
                                        <input type="name" id="search_name" name="name" class="rounded-full bg-white dark:bg-slate-900 shadow-sm dark:shadow-gray-700 !ps-12" placeholder="City, Address, Zip :">
                                        <button type="submit" class="btn bg-green-600 hover:bg-green-700 text-white !rounded-full">Find Out</button>
                                    </form>
                                </div>
                            </div>

                            <div *ngIf="activeindex === 3" id="rent-home" role="tabpanel" aria-labelledby="rent-home-tab">
                                <div class="subcribe-form z-1">
                                    <form class="relative max-w-2xl mx-auto">
                                        <i class="uil uil-search text-[20px] absolute top-[50%] -translate-y-1/2 start-4"></i>
                                        <input type="name" id="search_name" name="name" class="rounded-full bg-white dark:bg-slate-900 shadow-sm dark:shadow-gray-700 !ps-12" placeholder="City, Address, Zip :">
                                        <button type="submit" class="btn bg-green-600 hover:bg-green-700 text-white !rounded-full">Find Out</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="relative lg:ms-10">
                <div class="p-5 shadow-sm shadow-gyay-200 dark:shadow-gray-700 rounded-t-full bg-white dark:bg-slate-900">
                    <img [src]="'assets/images/hero.jpg'" class="shadow-md rounded-t-full rounded-md" alt="">
                </div>
                <div class="absolute bottom-2/4 translate-y-2/4 start-0 end-0 text-center">
                    <a [routerLink]="[]" (click)="isOpen = !isOpen" 
                    class="lightbox size-20 !rounded-full shadow-md shadow-gyay-200 dark:shadow-gyay-700 inline-flex items-center justify-center bg-white dark:bg-slate-900 text-green-600">
                    <i class="mdi mdi-play inline-flex items-center justify-center text-2xl">
                    </i>
                </a>
                </div>
                <div *ngIf="isOpen" class="flex bg-[#00000099] overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
                    <div class="relative p-1 w-full max-w-2xl max-h-full">
                        <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
                            <div class="flex items-center justify-between p-1 border-b rounded-t dark:border-gray-600 border-gray-200">
                                <button type="button" (click)="isOpen = !isOpen" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="default-modal">
                                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                                        <path stroke="currentColor" strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                                    </svg>
                                    <span class="sr-only">Close modal</span>
                                </button>
                            </div>
                            <div class="p-1 md:p-1 space-y-4">
                                <iframe width="100%" height="400" src="https://www.youtube.com/embed/yba7hPeTSjk?playlist=yba7hPeTSjk&loop=1"></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="relative md:pb-24 pb-16">
    <app-about/>

    <app-features/>

    <app-properties/>

    <app-clients/>

   <app-get-in-touch/>
</section>
<app-footer/>
