<app-navbar [childMessage]="'true'" [navLight]="true"/>

<!-- Bannière -->
<section class="relative table w-full py-32 lg:py-36 bg-[url('/assets/images/bg/01.jpg')] bg-no-repeat bg-center bg-cover">
  <div class="absolute inset-0 bg-slate-900/80"></div>
  <div class="container relative">
    <div class="grid grid-cols-1 text-center mt-10">
      <h3 class="md:text-4xl text-3xl md:leading-normal leading-normal font-medium text-white">
        Contactez-nous
      </h3>
    </div>
  </div>
</section>

<div class="relative">
  <div class="shape overflow-hidden z-1 text-white dark:text-slate-900">
    <svg viewBox="0 0 2880 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 48H1437.5H2880V0H2160C1442.5 52 720 0 720 0H0V48Z" fill="currentColor"></path>
    </svg>
  </div>
</div>

<!-- Contenu -->
<section class="relative lg:py-24 py-16">
  <div class="container relative">
    <div class="grid md:grid-cols-12 grid-cols-1 items-center gap-[30px]">

      <!-- Illustration -->
      <div class="lg:col-span-7 md:col-span-6">
        <img [src]="'/assets/images/svg/contact.svg'" alt="Contact">
      </div>

      <!-- Formulaire -->
      <div class="lg:col-span-5 md:col-span-6">
        <div class="lg:me-5">
          <div class="bg-white dark:bg-slate-900 rounded-md shadow-sm shadow-gray-200 dark:shadow-gray-700 p-6">
            <h3 class="mb-6 text-2xl leading-normal font-medium">
              Envoyez-nous un message
            </h3>

            <form>
              <div class="grid lg:grid-cols-12 lg:gap-6">
                <div class="lg:col-span-6 mb-5">
                  <label for="name" class="font-medium">Nom complet :</label>
                  <input
                    name="name"
                    id="name"
                    type="text"
                    class="form-input border !border-gray-200 dark:!border-gray-800 mt-2"
                    placeholder="Votre nom"
                  >
                </div>

                <div class="lg:col-span-6 mb-5">
                  <label for="email" class="font-medium">Adresse e-mail :</label>
                  <input
                    name="email"
                    id="email"
                    type="email"
                    class="form-input border !border-gray-200 dark:!border-gray-800 mt-2"
                    placeholder="Votre e-mail"
                  >
                </div>
              </div>

              <div class="grid grid-cols-1">
                <div class="mb-5">
                  <label for="subject" class="font-medium">Sujet :</label>
                  <input
                    name="subject"
                    id="subject"
                    class="form-input border !border-gray-200 dark:!border-gray-800 mt-2"
                    placeholder="Sujet de votre message"
                  >
                </div>

                <div class="mb-5">
                  <label for="comments" class="font-medium">Message :</label>
                  <textarea
                    name="comments"
                    id="comments"
                    class="form-input border !border-gray-200 dark:!border-gray-800 mt-2 textarea h-28"
                    placeholder="Écrivez votre message ici..."
                  ></textarea>
                </div>
              </div>

              <button
                type="submit"
                id="submit"
                name="send"
                class="btn bg-green-600 hover:bg-green-700 text-white rounded-md"
              >
                Envoyer le message
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Coordonnées -->
  <div class="container relative lg:mt-24 mt-16">
    <div class="grid grid-cols-1 lg:grid-cols-3 md:grid-cols-2 gap-[30px]">

      <!-- Téléphone -->
      <div class="text-center px-6">
        <div class="relative overflow-hidden text-transparent -m-3">
          <i data-feather="hexagon" class="size-32 fill-green-600/5 mx-auto"></i>
          <div class="absolute top-2/4 -translate-y-2/4 start-0 end-0 mx-auto text-green-600 rounded-xl transition-all duration-500 ease-in-out text-4xl flex align-middle justify-center items-center">
            <i class="uil uil-phone"></i>
          </div>
        </div>

        <div class="content mt-7">
          <h5 class="title h5 text-xl font-medium">Téléphone</h5>
          <p class="text-slate-400 mt-3">
            Contactez-nous pour toute information concernant les biens immobiliers.
          </p>

          <div class="mt-5">
            <a href="tel:+21699345678" class="btn btn-link text-green-600 hover:text-green-600 after:bg-green-600 transition duration-500">
              +216 99 345 678
            </a>
          </div>
        </div>
      </div>

      <!-- Email -->
      <div class="text-center px-6">
        <div class="relative overflow-hidden text-transparent -m-3">
          <i data-feather="hexagon" class="size-32 fill-green-600/5 mx-auto"></i>
          <div class="absolute top-2/4 -translate-y-2/4 start-0 end-0 mx-auto text-green-600 rounded-xl transition-all duration-500 ease-in-out text-4xl flex align-middle justify-center items-center">
            <i class="uil uil-envelope"></i>
          </div>
        </div>

        <div class="content mt-7">
          <h5 class="title h5 text-xl font-medium">Adresse e-mail</h5>
          <p class="text-slate-400 mt-3">
            Écrivez-nous pour toute question ou demande d’assistance.
          </p>

          <div class="mt-5">
            <a href="mailto:contact&#64;immobilier.com" class="btn btn-link text-green-600 hover:text-green-600 after:bg-green-600 transition duration-500">
              contact&#64;immobilier.com
            </a>
          </div>
        </div>
      </div>

      <!-- Localisation -->
      <div class="text-center px-6">
        <div class="relative overflow-hidden text-transparent -m-3">
          <i data-feather="hexagon" class="size-32 fill-green-600/5 mx-auto"></i>
          <div class="absolute top-2/4 -translate-y-2/4 start-0 end-0 mx-auto text-green-600 rounded-xl transition-all duration-500 ease-in-out text-4xl flex align-middle justify-center items-center">
