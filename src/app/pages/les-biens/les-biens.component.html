<div class="page-wrapper overflow-hidden" [ngClass]="{ 'toggled': activeSidebar }">
  <app-sidebaruser/>

  <main class="page-content bg-gray-50 dark:bg-slate-800">
    <app-topbar (toggleClass)="toggleClass()"/>

    <!-- Ajoutez un container avec padding -->
    <div class="container-fluid relative px-3">
      <div class="layout-specing">

        <div class="grid lg:grid-cols-3 md:grid-cols-2 grid-cols-1 mt-8 gap-[30px]">
          <div *ngFor="let item of biens" class="group rounded-xl bg-white dark:bg-slate-900 shadow-sm hover:shadow-xl dark:hover:shadow-xl shadow-gray-200 dark:shadow-gray-700 overflow-hidden ease-in-out duration-500">

            <div class="relative">
              <img [src]="item.images[0].url" class="w-full h-48 object-cover" alt="">
              <div class="absolute top-4 end-4">
                <a class="btn btn-icon bg-white dark:bg-slate-900 shadow-sm !rounded-full text-slate-100 dark:text-slate-700 hover:text-red-600">
                  <i class="mdi mdi-heart text-[20px]"></i>
                </a>
              </div>
            </div>

            <div class="p-6">
              <div class="pb-6">
                <a [routerLink]="'/property-detail'" class="text-lg hover:text-green-600 font-medium ease-in-out duration-500">{{item.titre}}</a>
              </div>

              <ul class="py-6 border-y border-slate-100 dark:border-gray-800 flex items-center list-none">
                <li class="flex items-center me-4">
                  <i class="uil uil-compress-arrows text-2xl me-2 text-green-600"></i>
                  <span>{{item.surface}} m²</span>
                </li>
                <li class="flex items-center me-4">
                  <i class="uil uil-bed-double text-2xl me-2 text-green-600"></i>
                </li>
                <li class="flex items-center">
                  <i class="uil uil-bath text-2xl me-2 text-green-600"></i>
                </li>
              </ul>

              <ul class="pt-6 flex justify-between items-center list-none">
                <li>
                  <span class="text-slate-400">Price</span>
                  <p class="text-lg font-medium">{{item.prix}} DT</p>
                </li>
                <li>
                  <span class="text-slate-400">Rating</span>
                  <ul class="text-lg font-medium text-amber-400 list-none">
                    <li class="inline mx-0.5"><i class="mdi mdi-star"></i></li>
                    <li class="inline mx-0.5"><i class="mdi mdi-star"></i></li>
                    <li class="inline mx-0.5"><i class="mdi mdi-star"></i></li>
                    <li class="inline mx-0.5"><i class="mdi mdi-star"></i></li>
                    <li class="inline mx-0.5"><i class="mdi mdi-star"></i></li>
                    <li class="inline text-black dark:text-white">5.0(30)</li>
                  </ul>
                </li>
              </ul>

              <div class="mt-6 pt-6 border-t border-slate-100 dark:border-gray-800">
                <button
                  (click)="contactOwner(item)"
                  class="w-full inline-flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-md ease-in-out duration-500">
                  <i class="mdi mdi-message-outline text-[18px]"></i>
                  Contacter le propriétaire
                </button>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>
</div>
