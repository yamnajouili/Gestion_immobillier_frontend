<div class="page-wrapper overflow-hidden"
     [ngClass]="{ 'toggled': activeSidebar }">

  <!-- Sidebar -->
  <app-sidebaruser />

  <main class="page-content bg-gray-50 dark:bg-slate-800">

    <!-- Topbar -->
    <app-topbar (toggleClass)="toggleClass()" />

    <div class="container-fluid relative px-3">

      <div class="layout-specing">

        <!-- ========================================= -->
        <!-- LISTE DES BIENS -->
        <!-- ========================================= -->

        <div
          class="grid lg:grid-cols-3 md:grid-cols-2 grid-cols-1 mt-8 gap-[30px]">

          <div
            *ngFor="let item of biensPagines"
            class="group rounded-xl bg-white dark:bg-slate-900
                   shadow-sm hover:shadow-xl dark:hover:shadow-xl
                   shadow-gray-200 dark:shadow-gray-700
                   overflow-hidden ease-in-out duration-500">

            <!-- IMAGE -->
            <div class="relative">

              <img
                *ngIf="item.images && item.images.length > 0"
                [src]="item.images[0].url"
                class="w-full h-48 object-cover"
                alt="Image du bien">


              <!-- FAVORI -->
              <div class="absolute top-4 end-4">

                <button
                  type="button"
                  (click)="toggleFavori(item, $event)"
                  class="btn btn-icon bg-white dark:bg-slate-900
                         shadow-sm !rounded-full">

                  <i
                    class="mdi text-[20px]"
                    [ngClass]="item.isFavori
                      ? 'mdi-heart text-red-600'
                      : 'mdi-heart-outline text-slate-400'">
                  </i>

                </button>

              </div>

            </div>


            <!-- CONTENU -->
            <div class="p-4">

              <!-- TITRE -->
              <div class="pb-4">

                <a
                  [routerLink]="['/property-detail-two', item.id]"
                  class="text-lg hover:text-green-600 font-medium ease-in-out duration-500">

                  {{ item.titre }}

                </a>

              </div>


              <!-- INFORMATIONS -->
              <ul
                class="py-4 border-y border-slate-100
                       dark:border-gray-800
                       flex  justify-around list-none">

                <!-- Surface -->
                <li class="flex items-center me-3">

                  <i
                    class="uil uil-compress-arrows
                           text-2xl me-2 text-green-600">
                  </i>

                  <span>
                    {{ item.surface }} m²
                  </span>

                </li>


                <!-- Type -->
                <li class="flex items-center">

                  <i
                    class="mdi mdi-home-outline
                           text-2xl me-2 text-green-600">
                  </i>

                  <span>
                    {{ item.type }}
                  </span>

                </li>

              </ul>


              <!-- PRIX -->
              <ul
                class="pt-6 ">

                <li class="  flex  flex-row justify-between">

                  <span class="text-slate-400">
                    Prix
                  </span>

                  <p class="text-lg font-medium">
                    {{ item.prix }} DT
                  </p>

                </li>

              </ul>
              <!-- VOIR DETAILS -->
              <div class="mt-1 flex justify-end">

                <a
                  [routerLink]="['/property-detail-two', item.id]"
                  class="inline-flex items-center gap-1
           text-green-600 hover:text-green-700
            underline underline-offset-2
           cursor-pointer">

                  <i class="mdi mdi-eye-outline text-[20px]"></i>

                  Voir détails

                </a>

              </div>

              <!-- CONTACTER PROPRIETAIRE -->
              <div
                class="mt-3 pt-6
                       border-t border-slate-100
                       dark:border-gray-800">

                <button
                  type="button"
                  (click)="contacterProprietaire(item); $event.stopPropagation()"
                  class="w-full inline-flex items-center
                         justify-center gap-2
                         bg-green-600 hover:bg-green-700
                         text-white font-medium
                         py-2 px-4 rounded-md
                         ease-in-out duration-500">

                  <i
                    class="mdi mdi-message-outline
                           text-[18px]">
                  </i>

                  Contacter le propriétaire

                </button>

              </div>

            </div>

          </div>

        </div>



        <!-- ========================================= -->

        <!-- PAGINATION -->
        <div
          *ngIf="totalPages > 1"
          class="flex justify-center items-center mt-5 mb-4">

          <div class="flex items-center gap-2">

            <!-- Précédent -->
            <button
              type="button"
              (click)="changerPage(pageActuelle - 1)"
              [disabled]="pageActuelle === 1"
              class="w-12 h-12 rounded-full
             flex items-center justify-center
             bg-white
             text-slate-400
             shadow-md
             hover:bg-green-600
             hover:text-white
             transition-all duration-300
             disabled:opacity-40
             disabled:hover:bg-white
             disabled:hover:text-slate-400
             disabled:cursor-not-allowed">

              <i class="mdi mdi-chevron-left text-xl"></i>

            </button>


            <!-- Numéros -->
            <button
              *ngFor="let page of pages"
              type="button"
              (click)="changerPage(page)"
              class="w-12 h-12 rounded-full
             flex items-center justify-center
             text-lg font-medium
             shadow-md
             transition-all duration-300"
              [ngClass]="
        pageActuelle === page
          ? 'bg-green-600 text-white'
          : 'bg-white text-slate-400 hover:bg-green-600 hover:text-white'
      ">

              {{ page }}

            </button>


            <!-- Suivant -->
            <button
              type="button"
              (click)="changerPage(pageActuelle + 1)"
              [disabled]="pageActuelle === totalPages"
              class="w-12 h-12 rounded-full
             flex items-center justify-center
             bg-white
             text-slate-400
             shadow-md
             hover:bg-green-600
             hover:text-white
             transition-all duration-300
             disabled:opacity-40
             disabled:hover:bg-white
             disabled:hover:text-slate-400
             disabled:cursor-not-allowed">

              <i class="mdi mdi-chevron-right text-xl"></i>

            </button>

          </div>

        </div>

      </div>

    </div>

  </main>

</div>
