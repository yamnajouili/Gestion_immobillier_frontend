<app-navbar/>

<section class="relative md:py-24 pt-24 pb-16">
    <div class="container relative">
        <div class="grid md:grid-cols-12 grid-cols-1 gap-[30px]">
            <div class="lg:col-span-8 md:col-span-7">
              <div
                class="grid grid-cols-1 relative"
                *ngIf="bien.images && bien.images.length > 0">

                <div class="tiny-one-item">

                  <div
                    *ngFor="let item of bien.images"
                    class="tiny-slide">

                    <!-- IMAGE -->
                    <img
                      *ngIf="!isVideo(item.url)"
                      [src]="item.url"
                      class="w-full h-[550px] object-cover rounded-md"
                      alt="Image du bien">

                    <!-- VIDEO -->
                    <video
                      *ngIf="isVideo(item.url)"
                      [src]="item.url"
                      class="w-full h-[550px] object-cover rounded-md"
                      controls
                      playsinline>
                    </video>

                  </div>

                </div>

              </div>

                <h4 class="text-2xl font-medium mt-6 mb-3">{{bien.titre}}</h4>
                <span class="text-slate-400 flex items-center"><i data-feather="map-pin" class="size-5 me-2"></i> {{bien.adresse}}</span>

                <ul class="py-6 flex items-center list-none">
                    <li class="flex items-center lg:me-6 me-4">
                        <i class="uil uil-compress-arrows lg:text-3xl text-2xl me-2 text-green-600"></i>
                        <span class="lg:text-xl">{{bien.surface}}sqf</span>
                    </li>

<!--                    <li class="flex items-center lg:me-6 me-4">-->
<!--                        <i class="uil uil-bed-double lg:text-3xl text-2xl me-2 text-green-600"></i>-->
<!--                        <span class="lg:text-xl">4 Beds</span>-->
<!--                    </li>-->

<!--                    <li class="flex items-center">-->
<!--                        <i class="uil uil-bath lg:text-3xl text-2xl me-2 text-green-600"></i>-->
<!--                        <span class="lg:text-xl">4 Baths</span>-->
<!--                    </li>-->
                </ul>

                <p class="text-slate-400">{{bien.description}}.</p>

                <div class="w-full leading-[0] border-0 mt-6">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d39206.002432144705!2d-95.4973981212445!3d29.709510002925988!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8640c16de81f3ca5%3A0xf43e0b60ae539ac9!2sGerald+D.+Hines+Waterwall+Park!5e0!3m2!1sen!2sin!4v1566305861440!5m2!1sen!2sin" style="border:0" class="w-full h-[500px]" allowfullscreen></iframe>
                </div>
            </div>

          <div class="lg:col-span-4 md:col-span-5 p-2">
            <div class="sticky top-20">

              <!-- CARD INFORMATIONS -->
              <div class="rounded-md bg-slate-50 dark:bg-slate-800 shadow-sm shadow-gray-200 dark:shadow-gray-700">

                <div class="p-6">

                  <h5 class="text-2xl font-medium">
                    Prix :
                  </h5>

                  <div class="flex justify-between items-center mt-4">

                    <span class="text-xl font-medium">
                        {{ bien.prix }} DT
                    </span>

                    <span class="bg-green-600/10 text-green-600 text-sm px-2.5 py-0.75 rounded h-6">
                        Disponible
                    </span>

                  </div>


                  <ul class="list-none mt-4">

                    <!-- TYPE DE BIEN -->
                    <li class="flex justify-between items-center">

                        <span class="text-slate-400 text-sm">
                            Type de bien
                        </span>

                      <span class="font-medium text-sm">
                            {{ bien.type }}
                        </span>

                    </li>


                    <!-- SURFACE -->
                    <li class="flex justify-between items-center mt-2">

                        <span class="text-slate-400 text-sm">
                            Surface
                        </span>

                      <span class="font-medium text-sm">
                            {{ bien.surface }} m²
                        </span>

                    </li>


                    <!-- VILLE -->
                    <li class="flex justify-between items-center mt-2">

                        <span class="text-slate-400 text-sm">
                            Ville
                        </span>

                      <span class="font-medium text-sm">
                            {{ bien.ville }}
                        </span>

                    </li>

                  </ul>

                </div>


                <!-- BOUTONS -->
                <div class="flex">

                  <div class="p-2 m-auto">

                    <a
                      [routerLink]="[]"
                      class="btn bg-green-600 hover:bg-green-700 text-white rounded-md w-full">

                      Ajouter aux favoris

                    </a>

                  </div>

                </div>

              </div>


              <!-- CONTACT -->
              <div class="mt-12 text-center">

                <h3 class="mb-6 text-xl leading-normal font-medium text-black dark:text-white">
                  Une question sur ce bien ?
                </h3>

                <div class="mt-6">

                  <a
                    (click)="contacterProprietaire(bien); $event.stopPropagation()"
                    class="btn bg-transparent hover:bg-green-600 border border-green-600 text-green-600 hover:text-white rounded-md">

                    <i class="uil uil-comment-alt-message align-middle me-2"></i>

                    Contacter propriétaire

                  </a>

                </div>

              </div>

            </div>
          </div>        </div>
    </div>
</section>
<app-footer-admin/>
