<section class="relative bg-green-600/5">
    <div class="container-fluid relative">
        <div class="grid grid-cols-1">
            <div class="flex flex-col min-h-screen justify-center md:px-10 py-10 px-4">
                <div class="text-center">
                    <a href="/"><img [src]="'/assets/images/logo-icon-64.png'" class="mx-auto" alt=""></a>

    <a [routerLink]="'/'" class="back-button btn btn-icon bg-green-600 hover:bg-green-700 text-white !rounded-full"><i data-feather="arrow-left" class="size-4"></i></a>
